name: resolveit-helpdesk-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: resolveit-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveit_db}
      POSTGRES_USER: ${POSTGRES_USER:-resolveit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveit_app} -d ${POSTGRES_DB:-resolveit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk-net

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    container_name: resolveit-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-resolveit_db}
      DB_USER: ${POSTGRES_USER:-resolveit_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_secure_password_123}
      JWT_SECRET: ${JWT_SECRET:-dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtcHVycG9zZXMtb25seS12ZXJ5LXNlY3VyZQ==}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - helpdesk-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: resolveit-frontend-dev
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - helpdesk-net

volumes:
  pg_data_dev:

networks:
  helpdesk-net:
    driver: bridge
